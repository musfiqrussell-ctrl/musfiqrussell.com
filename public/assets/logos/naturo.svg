<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%">
  <!-- NATURO Circular Leaf Emblem -->
  <g transform="translate(160, 95)">
    <!-- Solid Dark Green Circle -->
    <circle cx="0" cy="0" r="76" fill="#0B6635" />
    <!-- White Organic Curved Leaf -->
    <path d="M -34,36 C -40,-12 -8,-48 30,-52 C 34,-20 26,20 -12,46 C -18,48 -22,48 -24,42 C -23,32 -25,24 -34,36 Z" 
          fill="#FFFFFF" />
    <!-- Subtle Inner Vein Separation -->
    <path d="M -24,42 C -10,24 6,4 28,-36" 
          stroke="#0B6635" stroke-width="4.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- NATURO Wordmark -->
  <g transform="translate(160, 225)">
    <text x="0" y="0" 
          font-family="Arial, Helvetica, sans-serif" 
          font-size="46" 
          font-weight="900" 
          fill="#0B6635" 
          letter-spacing="2" 
          text-anchor="middle">NATURO</text>
    <!-- Trademark Symbol -->
    <text x="108" y="-22" 
          font-family="Arial, Helvetica, sans-serif" 
          font-size="15" 
          font-weight="900" 
          fill="#111827" 
          text-anchor="start">TM</text>
  </g>
</svg>
