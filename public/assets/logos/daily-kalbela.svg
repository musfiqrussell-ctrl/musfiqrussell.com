<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%">
  <g transform="translate(140, 140)">
    <!-- Red Clockwise Outer Sweep Arc with Arrow -->
    <!-- Arc from ~170 degrees (bottom-right) clockwise around to ~110 degrees -->
    <path d="M 28,98 C 68,90 108,60 114,6 C 122,-68 68,-118 0,-118 C -68,-118 -118,-68 -118,0 C -118,48 -88,92 -42,108" 
          fill="none" stroke="#ED1C24" stroke-width="13" stroke-linecap="round" />
    
    <!-- Red Clockwise Arrowhead at bottom (~ -20, 110) -->
    <polygon points="-56,92 -18,112 -50,132" fill="#ED1C24" />

    <!-- Clock Tick Marks on the Left Side (Red) -->
    <!-- 11 o'clock -->
    <line x1="-50" y1="-86" x2="-44" y2="-75" stroke="#ED1C24" stroke-width="4.5" stroke-linecap="round" />
    <!-- 10 o'clock -->
    <line x1="-86" y1="-50" x2="-75" y2="-44" stroke="#ED1C24" stroke-width="4.5" stroke-linecap="round" />
    <!-- 9 o'clock -->
    <line x1="-98" y1="0" x2="-86" y2="0" stroke="#ED1C24" stroke-width="4.5" stroke-linecap="round" />
    <!-- 8 o'clock -->
    <line x1="-86" y1="50" x2="-75" y2="44" stroke="#ED1C24" stroke-width="4.5" stroke-linecap="round" />
    <!-- 7 o'clock -->
    <line x1="-50" y1="86" x2="-44" y2="75" stroke="#ED1C24" stroke-width="4.5" stroke-linecap="round" />

    <!-- Center Black Stylized Compass / Eye Shape -->
    <!-- Pointed to the left with an eye-like curve and curl on right -->
    <path d="M -86,0 C -56,-32 -10,-48 82,-48 C 64,-10 74,4 98,10 C 92,24 82,30 68,26 C 62,34 50,30 46,20 C 42,-6 38,-14 38,-30 L 38,48 L -86,0 Z" 
          fill="#1C1C1E" />

    <!-- Central Clock Hands (Red) -->
    <!-- Needle 1 (pointing up to 12) -->
    <line x1="0" y1="0" x2="-14" y2="-68" stroke="#ED1C24" stroke-width="5" stroke-linecap="round" />
    <!-- Needle 2 (pointing to 2 o'clock) -->
    <line x1="0" y1="0" x2="30" y2="-28" stroke="#ED1C24" stroke-width="5" stroke-linecap="round" />
    <!-- Bottom Tail (pointing to 7 o'clock) -->
    <line x1="0" y1="0" x2="-28" y2="52" stroke="#ED1C24" stroke-width="4" stroke-linecap="round" />

    <!-- Center Hub Pivot: Red Ring with White Core -->
    <circle cx="0" cy="0" r="14" fill="#ED1C24" />
    <circle cx="0" cy="0" r="8" fill="#FFFFFF" />
  </g>
</svg>
