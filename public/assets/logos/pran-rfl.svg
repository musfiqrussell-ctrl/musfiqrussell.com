<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" width="100%" height="100%">
  <!-- PRAN Scalloped / Cloud Crest Badge -->
  <g transform="translate(15, 12)">
    <!-- Yellow Outer Border -->
    <path d="M 40,88 C 22,78 15,62 25,44 C 35,26 53,24 66,35 C 78,16 97,14 113,26 C 128,8 148,8 163,26 C 179,14 198,16 210,35 C 223,24 241,26 251,44 C 261,62 254,78 236,88 C 254,98 261,114 251,132 C 241,150 223,152 210,141 C 198,160 179,162 163,150 C 148,168 128,168 113,150 C 97,162 78,160 66,141 C 53,152 35,150 25,132 C 15,114 22,98 40,88 Z" 
          fill="#FFD200" stroke="#E59400" stroke-width="2" stroke-linejoin="round"/>
    <!-- Red Inner Crest Fill -->
    <path d="M 46,88 C 30,79 24,66 33,50 C 42,34 57,32 68,42 C 79,25 95,23 110,34 C 123,18 141,18 154,34 C 169,23 185,25 196,42 C 207,32 222,34 231,50 C 240,66 234,79 218,88 C 234,97 240,110 231,126 C 222,142 207,144 196,134 C 185,151 169,153 154,142 C 141,158 123,158 110,142 C 95,153 79,151 68,134 C 57,144 42,142 33,126 C 24,110 30,97 46,88 Z" 
          fill="#ED1C24"/>
    <!-- PRAN Bold White Text -->
    <text x="132" y="103" 
          font-family="Arial, Helvetica, sans-serif" 
          font-size="44" 
          font-weight="900" 
          fill="#FFFFFF" 
          letter-spacing="2.5" 
          text-anchor="middle">PRAN</text>
  </g>

  <!-- RFL Monogram Emblem inside Circle -->
  <g transform="translate(345, 100)">
    <!-- Outer Red Ring -->
    <circle cx="0" cy="0" r="76" fill="none" stroke="#ED1C24" stroke-width="12" />
    
    <!-- Stylized RFL Lettering -->
    <!-- R and F interconnected with L -->
    <g fill="#ED1C24">
      <!-- Main Stem for R & F -->
      <path d="M -48,-50 L -22,-50 C -6,-50 8,-41 8,-24 C 8,-9 -4,0 -19,2 L 8,50 L -14,50 L -33,9 L -33,50 L -48,50 Z M -33,-10 L -20,-10 C -10,-10 -3,-14 -3,-24 C -3,-33 -10,-37 -20,-37 L -33,-37 Z" />
      
      <!-- F Middle Bar extending from stem -->
      <path d="M -12,-8 L 22,-8 L 22,4 L -12,4 Z" />
      <!-- F Top Bar -->
      <path d="M 6,-50 L 38,-50 C 44,-50 48,-46 48,-40 L 48,-37 L 18,-37 L 18,-50 Z" />
      
      <!-- L Base -->
      <path d="M 12,38 L 48,38 C 50,38 52,40 52,43 L 52,50 L 8,50 L 8,14 L 20,14 L 20,38 Z" />
    </g>
  </g>
</svg>
